name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint all plugin PHP (a parse error in includes/** = white screen)
        run: |
          set -e
          err=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || { echo "PARSE ERROR: $f"; err=1; }
          done < <(find wp-ultra-mcp -path wp-ultra-mcp/vendor -prune -o -name '*.php' -print0)
          # Also lint the root uninstall.php + tests.
          for f in wp-ultra-mcp/uninstall.php tests/*.php; do
            php -l "$f" > /dev/null || { echo "PARSE ERROR: $f"; err=1; }
          done
          exit $err

      - name: Run test suite
        run: bash tests/run-all.sh

  static-analysis:
    name: Static analysis (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: phpcs, phpstan

      - name: PHPCS (WordPress-Extra where available)
        run: phpcs --standard=phpcs.xml.dist || true

      - name: PHPStan
        run: phpstan analyse --configuration=phpstan.neon.dist || true
